<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lost Management System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body class="bg-light">

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">
            Lost Management System
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto align-items-center">

                <li class="nav-item">
                    <a class="nav-link" href="{% url 'dashboard' %}">Dashboard</a>
                </li>

                {% if user.is_staff %}
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'user_management' %}">
                        <i class="bi bi-people-fill"></i> Users
                    </a>
                </li>
                {% endif %}

                <li class="nav-item">
                    <a class="nav-link" href="{% url 'add_lost' %}">Add Lost</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="{% url 'add_found' %}">Add Found</a>
                </li>

                <!-- Notification Bell with Badge -->
                <li class="nav-item position-relative">
                    <a class="nav-link" href="{% url 'notifications' %}">
                        <i class="bi bi-bell-fill"></i>
                        <span id="notificationCount" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" style="font-size: 10px; display: none;">0</span>
                    </a>
                </li>

                {% if user.is_authenticated %}
                <li class="nav-item">
                    <a class="btn btn-light ms-2" href="{% url 'logout' %}">Logout</a>
                </li>
                {% else %}
                <li class="nav-item">
                    <a class="btn btn-light ms-2" href="{% url 'login' %}">Login</a>
                </li>
                {% endif %}

            </ul>
        </div>
    </div>
</nav>

<!-- CONTENT -->
<div class="container py-4">
    {% block content %}
    {% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- SOUND NOTIFICATIONS -->
<script>
    // Play sound when new notification arrives
    function playNotificationSound() {
        var audio = new Audio('https://www.soundjay.com/misc/sounds/bell-ringing-05.mp3');
        audio.play().catch(function(e) {
            console.log("Sound play failed:", e);
        });
    }
    
    // Track notification count
    var lastCount = {{ unread_notifications|default:0 }};
    
    // Check for new notifications every 20 seconds
    function checkNewNotifications() {
        fetch('/notifications/api/unread-count/')
            .then(response => response.json())
            .then(data => {
                if (data.count > lastCount) {
                    // Play sound
                    playNotificationSound();
                    
                    // Show browser notification
                    if (Notification.permission === "granted") {
                        new Notification("🔔 Lost Management System", {
                            body: "You have a new notification!",
                            icon: "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath fill='%234f46e5' d='M8 16a2 2 0 0 0 2-2H6a2 2 0 0 0 2 2zm.995-14.901a1 1 0 1 0-1.99 0A5.002 5.002 0 0 0 3 6c0 1.098-.5 6-2 7h14c-1.5-1-2-5.902-2-7 0-2.42-1.72-4.44-4.005-4.901z'/%3E%3C/svg%3E"
                        });
                    }
                }
                lastCount = data.count;
                
                // Update bell badge
                var badge = document.getElementById('notificationCount');
                if (badge && data.count > 0) {
                    badge.textContent = data.count;
                    badge.style.display = 'inline-block';
                } else if (badge) {
                    badge.style.display = 'none';
                }
            })
            .catch(function(err) {
                console.log("Error checking notifications:", err);
            });
    }
    
    // Request permission for browser notifications
    if ('Notification' in window) {
        if (Notification.permission !== "granted" && Notification.permission !== "denied") {
            setTimeout(function() {
                Notification.requestPermission();
            }, 2000);
        }
    }
    
    // Check every 20 seconds for new notifications
    setInterval(checkNewNotifications, 20000);
    
    // Initial check after page loads
    setTimeout(checkNewNotifications, 5000);
</script>

</body>
</html>
